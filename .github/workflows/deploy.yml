name: Deploy to Vercel

# Обновляет существующий проект promptvault, поэтому адрес сайта не меняется.
# Требуется один секрет репозитория: VERCEL_TOKEN.
# Идентификаторы проекта и команды секретами не являются — держим их здесь.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_kmrNRVBKuZ2rtSCnAcsAoyB1
  VERCEL_PROJECT_ID: prj_kFKBzAnXOQRoMk8IhostgxJoYtCn

jobs:
  deploy:
    name: Сборка и публикация
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Установить Vercel CLI
        run: npm install --global vercel@latest

      - name: Забрать настройки проекта
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Собрать
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Опубликовать
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
